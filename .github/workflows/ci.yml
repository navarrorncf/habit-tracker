## A basic GitHub Actions workflow for your Quarkus application.

name: CI build

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Test Git conventions
        run: ./scripts/test-git-conventions.sh

      - name: Validate pull request Git conventions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          ./scripts/validate-git-conventions.sh branch "$BRANCH_NAME"
          ./scripts/validate-git-conventions.sh commit-range "$BASE_SHA" "$HEAD_SHA"

      - name: Build
        run: ./mvnw verify -B
